<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
  body {
    background: #f0f4ff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
  }
  .logo { font-size: 48px; font-weight: 800; color: #3b82f6; }
  .subtitle { color: #64748b; margin-top: 8px; font-size: 16px; }
  .dots { font-size: 24px; color: #3b82f6; margin-top: 24px; 
          animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }
</style>
</head>
<body>
  <div class="logo">Xenia</div>
  <div class="subtitle">Organizational Intelligence</div>
  <div class="dots">●  ●  ●</div>
</body>
</html>
